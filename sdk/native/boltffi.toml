[package]
name = "reseam_sdk"
crate = "reseam-sdk-native"

[targets.apple]
enabled = false

[targets.wasm]
enabled = false

[targets.android]
enabled = true
output = "../dist/android"

[targets.android.kotlin]
package = "app.reseam.sdk"
output = "../generated"
module_name = "ReseamSdk"
desktop_loader = "bundled"

[targets.android.pack]
output = "../jniLibs"

# AGP strips app libraries only when the app's build has its default NDK installed,
# so the SDK ships them stripped instead of relying on every consumer's toolchain.
[targets.android.link]
extra_args = ["-Wl,--strip-all"]
